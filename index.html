<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!--
    Everything between the seo markers is replaced per route by
    scripts/prerender.js (see src/lib/seo.js). What is here is the dev default.
  -->
  <!--seo:start-->
  <title>Nexora TechSolutions LLC | Technology &amp; Medical Education</title>
  <meta name="description" content="One company, two services: software, AI, QA, DevOps and SAFe® training for businesses, plus USMLE coaching, research and residency Match support for IMGs." />
  <!--seo:end-->
  <!-- useTheme rewrites this when the theme changes. -->
  <meta name="theme-color" content="#F6FAF8" />
  <meta name="author" content="Nexora TechSolutions LLC" />
  <meta name="format-detection" content="telephone=no" />

  <link rel="icon" href="/favicon.png" type="image/png" sizes="48x48" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!--
    media="print" keeps this off the critical path so it cannot block first
    paint. theme-boot.js flips it to "all" once it has loaded. Without this, a
    slow or blocked fonts.googleapis.com stops the whole page rendering.
  -->
  <link id="gfonts" media="print" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- Pages are prerendered, so without JS the content is still there:
         drop the loader and the scroll-reveal hiding. -->
    <style>#boot-loader{display:none!important}.reveal,.reveal>*,.word{opacity:1!important;transform:none!important;filter:none!important;animation:none!important}</style>
  </noscript>

  <script src="/theme-boot.js"></script>

  <!--
    Boot loader styles are inline on purpose: they must paint before the
    bundled CSS arrives, otherwise there is a blank frame first. Colours are
    literals for the same reason — tokens.css is not parsed yet. Keep them in
    step with src/styles/tokens.css.
  -->
  <style>
    :root{
      /* Dark (Obsidian Cyber) */
      --boot-bg:#070B0F; --boot-ink:#EDF6F2; --boot-muted:#9EBAAE; --boot-faint:#607A6E;
      --boot-accent:#00F59B; --boot-green:#00E5FF;
      --boot-ring:rgba(0,245,155,.12); --boot-ring-2:rgba(0,245,155,.20);
      --boot-track:rgba(0,245,155,.14);
      --boot-wash:radial-gradient(ellipse 80% 60% at 50% 20%, rgba(0,245,155,.12), transparent 70%), linear-gradient(135deg,#070B0F 0%,#0B131B 50%,#071015 100%);
    }
    :root[data-theme="light"]{
      /* Light (Tech Mint) */
      --boot-bg:#F6FAF8; --boot-ink:#0A1410; --boot-muted:#3D5248; --boot-faint:#6B8277;
      --boot-accent:#009F60; --boot-green:#008B8B;
      --boot-ring:rgba(0,159,96,.12); --boot-ring-2:rgba(0,159,96,.20);
      --boot-track:rgba(0,159,96,.14);
      --boot-wash:radial-gradient(ellipse 80% 60% at 50% 20%, rgba(0,245,155,.08), transparent 70%), linear-gradient(135deg,#F6FAF8 0%,#EDF4F1 50%,#E4F2EC 100%);
    }
    /* Technical leads with electric emerald, Medical with cyan / bio-teal — as the site tokens do. */
    :root[data-view="technical"]{ --boot-accent:#00F59B; --boot-green:#00E5FF; }
    :root[data-view="technical"][data-theme="light"]{ --boot-accent:#009F60; --boot-green:#008B8B; }
    :root[data-view="medical"]{ --boot-accent:#00E5FF; --boot-green:#00F59B; }
    :root[data-view="medical"][data-theme="light"]{ --boot-accent:#008B8B; --boot-green:#009F60; }
    html{ background:var(--boot-bg); }
    body{ margin:0; background:var(--boot-bg); }

    #boot-loader{
      position:fixed; inset:0; z-index:9999;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:var(--boot-bg); background-image:var(--boot-wash);
      font-family:'Public Sans',-apple-system,'Segoe UI',sans-serif;
      /* Visible from the first painted frame. main.jsx holds it on screen for
         a minimum time before fading, so it is always actually seen and still
         never flashes. */
      opacity:1;
    }
    @keyframes bootIn{ to{ opacity:1; } }

    #boot-loader.is-done{
      opacity:0; visibility:hidden;
      transition:opacity .5s ease, visibility 0s linear .5s;
      animation:none;
    }

    .boot-badge{ width:168px; height:168px; display:block; }
    .boot-ring-spin{ transform-origin:60px 60px; animation:bootSpin 9s linear infinite; }
    .boot-ring-spin.rev{ animation-duration:13s; animation-direction:reverse; }
    .boot-mark{ transform-box:fill-box; transform-origin:center; animation:bootMark 2.1s ease-in-out infinite; }
    .boot-mark-light{ display:none; }
    :root[data-theme="light"] .boot-mark-light{ display:inline; }
    :root[data-theme="light"] .boot-mark-dark{ display:none; }
    @keyframes bootSpin{ to{ transform:rotate(360deg); } }
    @keyframes bootMark{ 0%,100%{ transform:scale(1); opacity:.85; } 50%{ transform:scale(1.07); opacity:1; } }

    .boot-name{
      margin-top:34px;
      font-size:.82rem; font-weight:600; text-transform:uppercase;
      letter-spacing:.32em; text-indent:.32em;
      color:var(--boot-muted); white-space:nowrap;
    }

    .boot-track{
      margin-top:26px; width:212px; height:2px; border-radius:2px;
      background:var(--boot-track); overflow:hidden; position:relative;
    }
    .boot-track::after{
      content:""; position:absolute; top:0; bottom:0; left:0; width:34%;
      background:var(--boot-accent); border-radius:2px;
      box-shadow:0 0 10px -1px var(--boot-accent);
      animation:bootSlide 1.5s cubic-bezier(.65,0,.35,1) infinite;
    }
    @keyframes bootSlide{ 0%{ transform:translateX(-110%); } 100%{ transform:translateX(400%); } }

    /* Pure CSS escape hatch: if the bundle never arrives, say so. No inline
       script is possible here — the CSP forbids it. */
    .boot-slow{
      margin:30px 20px 0; max-width:34ch; text-align:center;
      font-size:.8rem; line-height:1.55; color:var(--boot-faint);
      opacity:0; animation:bootIn .4s ease 9s forwards;
    }
    .boot-slow a{ color:var(--boot-accent); }

    .boot-sr{
      position:absolute; width:1px; height:1px; padding:0; margin:-1px;
      overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
    }

    @media (max-width:520px){
      .boot-badge{ width:132px; height:132px; }
      .boot-name{ font-size:.68rem; letter-spacing:.22em; text-indent:.22em; margin-top:26px; }
      .boot-track{ width:min(66vw,190px); }
    }

    @media (prefers-reduced-motion: reduce){
      .boot-ring-spin,.boot-mark,.boot-track::after{ animation:none; }
      .boot-track::after{ width:100%; box-shadow:none; }
      .boot-slow{ animation:none; opacity:1; }
    }
  </style>
</head>
<body>
  <!-- Removed by src/main.jsx once React has mounted. -->
  <div id="boot-loader" role="status" aria-live="polite">
    <span class="boot-sr">Loading Nexora TechSolutions…</span>

    <svg class="boot-badge" viewBox="0 0 120 120" fill="none" aria-hidden="true">
      <!-- Concentric rings framing the mark. -->
      <circle cx="60" cy="60" r="52" stroke="var(--boot-ring)" stroke-width="1" />
      <circle cx="60" cy="60" r="43" stroke="var(--boot-ring-2)" stroke-width="1" />
      <!-- Slowly counter-rotating arcs give the rings some life. -->
      <g class="boot-ring-spin">
        <circle cx="60" cy="60" r="52" stroke="var(--boot-accent)" stroke-width="1"
                stroke-linecap="round" stroke-dasharray="26 300" opacity=".85" />
      </g>
      <g class="boot-ring-spin rev">
        <circle cx="60" cy="60" r="43" stroke="var(--boot-green)" stroke-width="1"
                stroke-linecap="round" stroke-dasharray="16 254" opacity=".7" />
      </g>

      <!-- Nexora "N" mark: colour on light, white on dark (public/logo-mark*.png). -->
      <image class="boot-mark boot-mark-light" href="/logo-mark.png" x="36" y="36.75" width="48" height="46.5" />
      <image class="boot-mark boot-mark-dark" href="/logo-mark-dark.png" x="36" y="36.75" width="48" height="46.5" />
    </svg>

    <div class="boot-name" aria-hidden="true">Nexora Tech Solutions LLC</div>
    <div class="boot-track" aria-hidden="true"></div>

    <p class="boot-slow">
      This is taking longer than usual. If it does not load, email
      <a href="mailto:minchu@nexoratechsolutionsllc.com">minchu@nexoratechsolutionsllc.com</a>
      or call +1 (678) 925-8885.
    </p>
  </div>

  <div id="root"></div>
  <noscript>
    <div style="padding:40px;font-family:sans-serif;max-width:640px;margin:0 auto">
      <p>Parts of this site need JavaScript. Reach us directly at
        <a href="mailto:minchu@nexoratechsolutionsllc.com">minchu@nexoratechsolutionsllc.com</a>
        or +1 (678) 925-8885.</p>
    </div>
  </noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
